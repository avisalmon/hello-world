<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Improvise — Jazz Ensemble</title><style>body{font:16px system-ui;background:#101723;color:#eaf0fa;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{font-size:2.5rem;color:#e4c68c}section{background:#1c293a;border-radius:16px;padding:20px;margin:16px 0}label{display:inline-block;margin:8px}button,select,input{font:inherit}button,select{padding:9px;border-radius:8px;border:0}button{background:#dfb86c;color:#151515;cursor:pointer}input[type=range]{vertical-align:middle}.chords{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.chord{background:#304257;padding:18px;text-align:center;border-radius:10px;font-size:1.2rem}.active{background:#d4aa61;color:#111}small{color:#b5c5d5}</style></head><body><main><h1>🎹 Improvise</h1><p>Your interactive jazz ensemble. You play the piano.</p><section><label>Progression <select id="prog"><option value="soft">Soft Evening Jazz</option><option value="blues">12-Bar Blues</option><option value="circle">Circle of Fifths — A minor</option><option value="custom">Custom chords</option></select></label><label>Style <select id="style"><option value="jazz">Cocktail Jazz</option><option value="blues">Blues</option><option value="bossa">Bossa Nova</option></select></label><p><label>Custom progression (separate bars with |)<br><input id="custom" style="width:min(95%,600px)" value="Am7 | Dm7 | G7 | Cmaj7"></label></p><label>Tempo <input id="tempo" type="range" min="50" max="180" value="76"><output id="bpm">76 BPM</output></label><label>Master <input id="master" type="range" min="0" max="100" value="70"></label></section><section><h2>Band mixer</h2><div id="mixer"></div></section><section><h2>Pre-rendered recordings</h2><p id="libraryStatus"><small>Checking static track catalog…</small></p><div id="library"></div></section><section><button id="play">▶ Play</button> <button id="stop">■ Stop</button><p><small>Browser audio requires a tap to start. Sound is synthesized in this prototype; acoustic sample upgrades are planned.</small></p><div class="chords" id="chords"></div></section></main><script>
const presets={soft:['Cmaj9','Am9','Dm9','G13','Em9','A7b9','Dm9 G13','Cmaj9'],blues:['C7','F7','C7','C7','F7','F7','C7','A7','Dm7','G7','C7','G7'],circle:['Am7','Am7','Am7','Am7','Dm7','G7','Cmaj7','Fmaj7','Bm7b5','E7','Am7']};
const root={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const mixer=document.querySelector('#mixer'),tracks={bass:{on:true,vol:75},guitar:{on:true,vol:45},drums:{on:true,vol:40}};
Object.keys(tracks).forEach(n=>{const p=document.createElement('p');p.innerHTML='<label><input type="checkbox" checked data-on="'+n+'"> '+n+'</label><label>Volume <input type="range" min="0" max="100" value="'+tracks[n].vol+'" data-vol="'+n+'"></label>';mixer.append(p)});
mixer.addEventListener('input',e=>{let n=e.target.dataset.on||e.target.dataset.vol;if(n){if(e.target.type==='checkbox')tracks[n].on=e.target.checked;else tracks[n].vol=+e.target.value}});
let ctx,playing=false,step=0,timer=null,scheduledUntil=0,runId=0,activeBar=-1;const $=s=>document.querySelector(s);
function chords(){return $('#prog').value==='custom'?$('#custom').value.split('|').map(x=>x.trim()).filter(Boolean):presets[$('#prog').value]}
function render(){const a=chords();$('#chords').replaceChildren();a.forEach((c,i)=>{let d=document.createElement('div');d.className='chord'+(playing&&i===activeBar?' active':'');d.textContent=c;$('#chords').append(d)})}
function freq(m){return 440*Math.pow(2,(m-69)/12)}
function tone(m,when,dur,vol,type='triangle'){let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq(m);g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),when+.014);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+dur+.03)}
function noise(when,dur,vol){let buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate),a=buffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);let src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();src.buffer=buffer;f.type='highpass';f.frequency.value=1800;g.gain.value=vol;src.connect(f).connect(g).connect(ctx.destination);src.start(when)}
function notes(ch){let m=ch.match(/^([A-G](?:#|b)?)/);if(!m)return [48,52,55,59];let r=root[m[1]];if(r===undefined)return [48,52,55,59];let minor=/m(?!aj)|dim|ø/.test(ch),dim=/dim|b5|ø/.test(ch);let base=48+r;return [base,base+(minor?3:4),base+(dim?6:7),base+(/7|9|13/.test(ch)?10:12)]}
function pluck(m,when,dur,vol){const o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(freq(m),when);filter.type='lowpass';filter.frequency.setValueAtTime(2400,when);filter.frequency.exponentialRampToValueAtTime(360,when+Math.min(dur,.35));g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),when+.008);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(filter).connect(g).connect(ctx.destination);o.start(when);o.stop(when+dur+.03)}
function beat(){if(!playing||!ctx)return;let arr=chords();if(!arr.length){$('#stop').click();return;}step%=arr.length;activeBar=step;let ns=notes(arr[step].split(' ')[0]),now=Math.max(ctx.currentTime+.035,scheduledUntil||0),bar=240/(+$('#tempo').value),master=+$('#master').value/100,style=$('#style').value;scheduledUntil=now+bar;
if(tracks.bass.on){let v=tracks.bass.vol/100*master*.20;for(let i=0;i<4;i++){let n=ns[i%2===0?0:2]-12;pluck(n,now+i*bar/4,bar/5,v)}}
if(tracks.guitar.on){let v=tracks.guitar.vol/100*master*.045;for(let i=0;i<4;i++){if(style==='bossa'&&i===0||style!=='bossa'&&i%2===1||style==='bossa'&&i===2){ns.slice(1).forEach((n,j)=>pluck(n+12,now+i*bar/4+j*.012,bar/5,v))}}}
if(tracks.drums.on){let v=tracks.drums.vol/100*master*.18;for(let i=0;i<8;i++)noise(now+i*bar/8,.055,v*(i%2?0.18:0.35));for(let i of [1,3])noise(now+i*bar/4,.12,v*.8)}
render();step=(step+1)%arr.length;timer=setTimeout(beat,Math.max(10,(scheduledUntil-ctx.currentTime-.04)*1000))}
$('#play').onclick=async()=>{if(playing)return;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;step=0;activeBar=-1;scheduledUntil=0;runId++;beat()};
$('#stop').onclick=()=>{playing=false;runId++;clearTimeout(timer);step=0;activeBar=-1;scheduledUntil=0;if(ctx){const old=ctx;ctx=null;old.close().catch(()=>{});}render()};
$('#prog').onchange=()=>{if(playing)$('#stop').click();render();saveSettings()};$('#custom').oninput=()=>{if(playing)$('#stop').click();render();saveSettings()};$('#tempo').oninput=()=>{$('#bpm').textContent=$('#tempo').value+' BPM';if(playing){$('#stop').click();}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)$('#stop').click()});
function saveSettings(){try{localStorage.setItem('improvise-v1',JSON.stringify({prog:$('#prog').value,custom:$('#custom').value,style:$('#style').value,tempo:$('#tempo').value,master:$('#master').value,tracks}))}catch(e){}}
function loadSettings(){try{const v=JSON.parse(localStorage.getItem('improvise-v1')||'null');if(!v)return;for(const k of ['prog','custom','style','tempo','master'])if(v[k]!=null&&$('#'+k))$('#'+k).value=v[k];for(const n of Object.keys(tracks)){if(v.tracks&&v.tracks[n]){tracks[n].on=!!v.tracks[n].on;tracks[n].vol=Math.min(100,Math.max(0,+v.tracks[n].vol||0));const on=mixer.querySelector('[data-on="'+n+'"]'),vol=mixer.querySelector('[data-vol="'+n+'"]');if(on)on.checked=tracks[n].on;if(vol)vol.value=tracks[n].vol}}$('#bpm').textContent=$('#tempo').value+' BPM'}catch(e){}}
async function loadCatalog(){try{const response=await fetch('./audio/catalog.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const catalog=await response.json();if(!Array.isArray(catalog.tracks))throw Error('Invalid catalog');$('#libraryStatus').textContent=catalog.tracks.length?catalog.tracks.length+' pre-rendered arrangements available':'Pre-rendered acoustic tracks are not uploaded yet. Synthesized demo remains available.';for(const t of catalog.tracks){if(!t.id||!t.title||!t.stems)continue;const p=document.createElement('p');p.textContent=t.title+' — '+t.bpm+' BPM';$('#library').append(p)}}catch(e){$('#libraryStatus').textContent='Audio catalog unavailable; synthesized demo remains available.'}}loadCatalog();loadSettings();for(const id of ['style','master','tempo'])$('#'+id).addEventListener('change',saveSettings);mixer.addEventListener('change',saveSettings);mixer.addEventListener('pointerup',saveSettings);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();playing?$('#stop').click():$('#play').click()}});render();
</script></body></html>
