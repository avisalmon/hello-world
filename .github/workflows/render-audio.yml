name: Render static demo stems
on:
  push:
    branches: [master]
    paths: ['scripts/render_stems.py', '.github/workflows/render-audio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python scripts/render_stems.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/catalog.json audio/stems/
          git diff --cached --quiet || (git commit -m "Render first static synchronized demo stems" && git push)
