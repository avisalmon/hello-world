name: Improvise deployed-site smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public GitHub Pages launcher and original recording
        shell: bash
        run: |
          set -euo pipefail
          base="https://avisalmon.github.io/hello-world"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 40 "$base/" -o /tmp/improvise-index.html
          grep -Fq './original.html' /tmp/improvise-index.html || {
            echo "Default launcher no longer points to original.html"; exit 1;
          }
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --max-time 60 "$base/original.html" -o /tmp/improvise-original.html
          test "$(wc -c < /tmp/improvise-original.html)" -gt 1000000 || {
            echo "Original demo payload unexpectedly small"; exit 1;
          }
          grep -aiq 'audio/mpeg\|audio/mp3\|data:audio' /tmp/improvise-original.html || {
            echo "No embedded audio marker in deployed demo"; exit 1;
          }
          if ! cmp -s original.html /tmp/improvise-original.html; then
            echo "FAIL: deployed original.html differs byte-for-byte from the preserved repository original."
            echo "Repository SHA-256: $(sha256sum original.html | cut -d\x27 \x27 -f1)"
            echo "Deployed SHA-256:   $(sha256sum /tmp/improvise-original.html | cut -d\x27 \x27 -f1)"
            exit 1
          fi
          echo "PASS: deployed original.html exactly matches the preserved repository original."
          echo "NOTE: HTTP checks do not verify audio decoding, subjective quality, playback, looping or mobile support."
